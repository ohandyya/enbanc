name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # The venv pyproject.toml points pyright at (venvPath="." / venv=".venv").
      - name: Install dependencies
        run: uv sync --all-groups

      # The same target used locally, so CI cannot drift from `make check-all`. This is the gate
      # that still holds when someone commits with --no-verify.
      - name: Run gates
        run: make check-all
