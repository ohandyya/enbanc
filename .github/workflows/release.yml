name: Release
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Check tag matches version
        run: |
          test "v$(uv version --short)" = "${{ github.ref_name }}"

      - run: uv build
      - run: uv publish --trusted-publishing always
