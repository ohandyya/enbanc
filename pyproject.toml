[project]
name = "enbanc"
version = "0.0.4"
description = "Adversarial multi-agent adjudication for structured decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andy Tseng", email = "ohandyya@gmail.com" }]
keywords = ["llm", "agents", "multi-agent", "adjudication", "pydantic-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai>=2.36.0",
]

# The built-in `web_search` tool talks to Tavily directly, so tavily-python is an extra rather
# than a core dependency: a tribunal whose advocates only query your own systems should not have
# to install a search client. See docs/design/evidence.md.
[project.optional-dependencies]
web = ["tavily-python>=0.5.0"]

[project.urls]
Homepage = "https://github.com/ohandyya/enbanc"
Repository = "https://github.com/ohandyya/enbanc"

[build-system]
# uv_build is allowlist-based, not gitignore-based. It ships `src/enbanc/` plus README.md,
# LICENSE, and pyproject.toml; nothing else is eligible. docs/, notes/, local/, and tests/ stay
# out because they were never included — not because .gitignore filtered them. Widening that is
# opt-in via `[tool.uv.build-backend]`, so keeping human-only material unshippable depends on
# this section staying bare. Check what an edit actually did with:
#     uv build && tar tzf dist/*.tar.gz
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
# The support floor from `requires-python`, not the 3.13 in .python-version. Pinning it here is
# what stops pyupgrade (UP) from rewriting code into 3.12+ syntax that a 3.11 user could not run.
target-version = "py311"

[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown by default. README.md and docs/glossary.md
# describe an API that does not exist yet and align their inline comments on purpose — they are
# read as prose, not compiled — and the formatter collapses that alignment. Excluding Markdown
# holds this gate at exactly the scope that matters: every `.py` file is still formatted and checked.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["enbanc"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
# Same reason as ruff's target-version: type-check against the oldest interpreter the package
# claims to support, so a 3.12+ stdlib API cannot slip into a release that advertises 3.11.
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# `auto`, so an `async def test_` just runs — no per-test decorator to forget.
asyncio_mode = "auto"
# Each test gets a fresh event loop. A session-wide loop leaks state between tests via anything
# that caches a loop-bound object, which is exactly the kind of order-dependent failure that is
# miserable to track down.
asyncio_default_fixture_loop_scope = "function"
