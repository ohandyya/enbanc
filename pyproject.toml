[project]
name = "enbanc"
version = "0.0.4"
description = "Adversarial multi-agent adjudication for structured decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andy Tseng", email = "ohandyya@gmail.com" }]
keywords = ["llm", "agents", "multi-agent", "adjudication", "pydantic-ai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "pydantic-ai>=2.36.0",
    # `web_search` is the default tool docs/design/evidence.md ships, and it calls Tavily's SDK
    # directly rather than wrapping PydanticAI's built-in. It is core rather than an extra because
    # it appears in the README sample and in api.md's first example: a default a default install
    # cannot import is not a default. Only tiktoken is genuinely new — httpx and requests already
    # arrive with pydantic-ai. See docs/decisions/0018-the-search-client-is-a-core-dependency.md.
    "tavily-python>=0.8.1",
    # `TypeAliasType`, which `typing` only ships from 3.12. The three generic aliases in
    # docs/design/api.md — Filing, Deliberation, Outcome — need it at the 3.11 floor, and
    # a plain alias parameterized by a bare TypeVar collapses under Pydantic rather than
    # failing loudly. Declared rather than borrowed: pydantic pins this exact floor so it
    # arrives anyway, but enbanc imports it directly and a package declares what it imports.
    # This line and the import both go when requires-python moves to 3.12 and the aliases
    # become `type Filing[V: Verdict] = ...`. See docs/design/packaging.md.
    "typing-extensions>=4.14.1",
]

[project.urls]
Homepage = "https://github.com/ohandyya/enbanc"
Repository = "https://github.com/ohandyya/enbanc"

[build-system]
# uv_build is allowlist-based, not gitignore-based. It ships `src/enbanc/` plus README.md,
# LICENSE, and pyproject.toml; nothing else is eligible. docs/, notes/, local/, and tests/ stay
# out because they were never included — not because .gitignore filtered them. Widening that is
# opt-in via `[tool.uv.build-backend]`, so keeping human-only material unshippable depends on
# this section staying bare. Check what an edit actually did with:
#     uv build && tar tzf dist/*.tar.gz
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # Goldens for the prompting surface docs/design/prompting.md pins to `procedure = 'p1'`.
    # Expected text lives inline in the test, so a prompt change shows up as a prompt diff in
    # the file under review. `pytest --inline-snapshot=fix` rewrites them. It is also what
    # pydantic-ai itself uses, which keeps one idiom across the dependency boundary.
    "inline-snapshot>=0.31.2",
    "pre-commit>=4.6.2",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
line-length = 100
# The support floor from `requires-python`, not the 3.13 in .python-version. Pinning it here is
# what stops pyupgrade (UP) from rewriting code into 3.12+ syntax that a 3.11 user could not run.
target-version = "py311"

[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown by default. README.md and docs/glossary.md
# describe an API that does not exist yet and align their inline comments on purpose — they are
# read as prose, not compiled — and the formatter collapses that alignment. Excluding Markdown
# holds this gate at exactly the scope that matters: every `.py` file is still formatted and checked.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["enbanc"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
# Same reason as ruff's target-version: type-check against the oldest interpreter the package
# claims to support, so a 3.12+ stdlib API cannot slip into a release that advertises 3.11.
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Required by the tier layout, not a preference. A test's tier is its directory
# (docs/decisions/0031-tests-are-tiered.md), so the same subject is tested from several of
# them and `tests/unit/test_web_search.py` and `tests/integration/test_web_search.py` are the
# normal case. Under the default `prepend` mode those two share a top-level module name and
# collection fails outright; `importlib` gives each file a name derived from its full path.
# The alternative is __init__.py in every tier directory, which buys the same thing and makes
# tests a package for no other reason.
addopts = "--import-mode=importlib"
# One per tier directory. `tests/conftest.py` applies these during collection from the path a
# test was collected from, so nothing is decorated by hand and nothing can be forgotten;
# registering them here is what keeps an unknown marker an error rather than a typo that runs.
# See docs/design/testing.md and docs/decisions/0031-tests-are-tiered.md.
markers = [
    "unit: enbanc's own behaviour, offline and enforced",
    "contract: what docs/design/execution.md claims about pydantic-ai",
    "integration: reaches a real provider or Tavily; in CI only on demand",
    "e2e: api.md's example end to end; in CI only on demand",
]
# A warning this library cares about is a warning worth a test. CostNotFoundWarning in
# particular is specified as firing exactly once per proceeding (docs/design/execution.md), and
# a suite that swallows warnings by default cannot assert that. Errors here, `pytest.warns`
# where it is expected.
filterwarnings = ["error"]
# `auto`, so an `async def test_` just runs — no per-test decorator to forget.
asyncio_mode = "auto"
# Each test gets a fresh event loop. A session-wide loop leaks state between tests via anything
# that caches a loop-bound object, which is exactly the kind of order-dependent failure that is
# miserable to track down.
asyncio_default_fixture_loop_scope = "function"
